<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Formulaire corrigé</title>
</head>
<body>

<form method="post">

    <!-- Erreur 1 : l'attribut for doit correspondre à l'id -->
    <label for="nom">Nom</label>
    <input type="text" id="nom" name="nom">

    <br><br>

    <label for="prenom">Prénom</label>
    <!-- Erreur 2 : ajout de l'attribut name -->
    <input type="text" id="prenom" name="prenom">

    <br><br>

    <label for="email">E-mail</label>
    <!-- Erreur 3 : type email pour valider le format -->
    <input type="email" id="email" name="email">

    <br><br>

    <label for="mdp">Mot de passe</label>
    <!-- Erreur 4 : type password pour masquer le texte -->
    <input type="password" id="mdp" name="mdp">

    <br><br>

    <p>Formule :</p>

    <!-- Erreur 5 : même name pour les deux boutons radio -->
    <input type="radio" id="f1" name="formule"
           value="mensuelle">
    <label for="f1">Mensuelle</label>

    <input type="radio" id="f2" name="formule"
           value="annuelle">
    <label for="f2">Annuelle</label>

    <br><br>

    <label for="ville">Ville</label>
    <!-- Erreur 6 : ajout de l'attribut name -->
    <select id="ville" name="ville">
        <option value="rabat">Rabat</option>
        <option value="sale">Salé</option>
    </select>

    <br><br>

    <label for="msg">Message</label>
    <!-- Erreur 7 : textarea est une balise, pas un type input -->
    <textarea id="msg" name="message"></textarea>

    <br><br>

    <!-- Erreur 8 : submit pour envoyer le formulaire -->
    <button type="submit">Envoyer</button>

</form>

</body>
</html>
